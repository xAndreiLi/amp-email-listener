name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The spool and fetcher, the Amp plugin against a stub host, and the Graph source against a
      # stubbed Graph. All offline. Loading the plugin in a real Amp session is done by hand.
      - name: Checks
        run: npm run test:all
      # Amp executes plugins with Bun, so the source harness runs there too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Amp runtime checks
        run: bun run scripts/load-check.ts
      # The plugin ships as one file and runs under Bun. Build it, then copy it into a directory with
      # no node_modules and drive it there, so a missing import cannot hide behind the checkout.
      - name: Build plugin
        run: npm run build
      - name: Installed-copy check
        run: npm run install-check
