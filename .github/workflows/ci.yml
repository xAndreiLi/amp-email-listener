name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The spool and fetcher, the Amp plugin against a stub host, and the Graph source against a
      # stubbed Graph. All offline. Loading the plugin in a real Amp session is done by hand.
      - name: Checks
        run: npm run test:all
      # Amp executes plugins with Bun, so the same stub harness and the Node handoff run there too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Amp runtime checks
        run: |
          bun run scripts/load-check.ts
          bun run scripts/service-check.ts
      # The checkout tested above is not the layout users get: only an installed package sits under
      # node_modules, where Node will not strip types and the Amp host is not present. This packs the
      # tarball, installs it into a throwaway project and drives that copy.
      - name: Installed-copy check
        run: npm run install-check
