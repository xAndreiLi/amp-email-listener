name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: Check NPM_TOKEN
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN secret is missing. Create an npm Automation token, or a granular access token with 'Bypass 2FA' and read/write on All packages, then add it as the NPM_TOKEN repository secret."
            exit 1
          fi
          npm whoami
      # The tag is what triggers this workflow, but the suite is what decides whether it ships: a
      # tag must not publish an artifact the checkout has not proven. Loading the plugin in a real
      # Amp session is done by hand.
      - name: Checks
        run: npm run test:all
      # Amp executes plugins with Bun, so the same stub harness and the Node handoff run there too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Amp runtime checks
        run: |
          bun run scripts/load-check.ts
          bun run scripts/service-check.ts
      # The checkout the step above tests is not the layout users get: only an installed package sits
      # under node_modules, where Node will not strip types and the Amp host is not present. This packs
      # the tarball, installs it into a throwaway project and drives that copy, so a tag cannot publish
      # an artifact that only works from a checkout.
      - name: Installed-copy check
        run: npm run install-check
      # A tag names the release; package.json decides what npm receives. If they disagree, stop
      # rather than publish one version under another version's tag (or skip as already published).
      - name: Check tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi
      - name: Check published version
        id: published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "amp-email-listener@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "amp-email-listener@${version} is already published; skipping publish so tag pushes stay idempotent."
          fi
      - name: Publish
        if: steps.published.outputs.exists != 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `prepublishOnly` would run the suite a second time; the step above already did.
          NPM_CONFIG_IGNORE_SCRIPTS: "true"
        run: |
          set +e
          npm publish --provenance --access public > publish.log 2>&1
          code=$?
          cat publish.log
          if [ $code -ne 0 ]; then
            grep -E "npm error|EOTP|E403|E404|ENEEDAUTH|error" publish.log | head -20 | while IFS= read -r line; do
              echo "::error::publish: ${line}"
            done
          fi
          exit $code
